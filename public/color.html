<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Color? | KUSO Game</title><link rel="stylesheet" href="/color.css"><script src="/zoom-lock.js" defer></script><script src="/color-rules.js" defer></script><script src="/color.js" defer></script></head><body><main><header><a href="/" aria-label="ゲーム一覧へ">‹</a><h1>Color?</h1></header><section id="intro"><div class="logo" aria-hidden="true"><span>赤</span><span>黄</span><span>青</span></div><button id="start">START</button><p class="hint">文字の意味を選ぶ · 50問</p><section class="ranking"><h2>ランキング</h2><p id="ranking-status" role="status">読み込み中…</p><ol id="ranking-list"></ol><button id="refresh">更新</button></section></section><div id="count" hidden>3</div><section id="play" hidden><div class="hud"><strong id="progress">0 / 50</strong><span id="timer">0.00 s</span></div><div id="word-area"><div id="word-stream"><div id="upcoming" aria-label="次の問題"></div><strong id="word" class="stream-word current" aria-live="off"></strong></div></div><div id="choices"><button data-answer="0">赤</button><button data-answer="1">黄</button><button data-answer="2">青</button></div></section><section id="result" hidden><strong id="final"></strong><p id="save-status" role="status"></p><button id="again">もう一度</button><button id="menu">ランキングを見る</button></section></main></body></html>
