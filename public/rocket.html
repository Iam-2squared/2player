<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111f34"><title>GRAPH ROCKET | KUSO Game</title><link rel="stylesheet" href="/rocket.css"><script src="/rocket-rules.js" defer></script><script src="/rocket.js" defer></script></head>
<body><main><header><a href="/" aria-label="ゲーム一覧に戻る">‹</a><h1>GRAPH ROCKET</h1><button id="reset" aria-label="リセット">↻</button></header>
<div class="stats"><strong id="stage">01</strong><span id="lives" aria-label="残りライフ">♥♥♥</span><span id="ammo" aria-label="残り発射回数">5</span></div>
<svg id="field" viewBox="0 0 440 440" role="img" aria-label="座標平面、原点のロケット、敵拠点と飛来物"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#263e56" stroke-width="1"/></pattern></defs><rect x="20" y="20" width="400" height="400" rx="4" fill="url(#grid)"/><g id="axes" stroke="#7d9db6"><path d="M20 220H420M220 420V20" fill="none"/></g><g id="labels"></g><g id="targets"></g><path id="preview" fill="none" stroke="#71c6d4" stroke-dasharray="5 5" stroke-width="1.8"/><path id="trail" fill="none" stroke="#8bf3e1" stroke-width="3" stroke-linecap="round"/><g id="ship" transform="translate(220 220) rotate(90)"><path d="M0 -11Q7 -4 4 6H-4Q-7 -4 0 -11Z" fill="#f4f8ff"/><circle cy="-3" r="2.4" fill="#62c4db"/><path d="M-3 8L0 15L3 8" fill="#ffbd71"/></g></svg>
<form id="fire-form"><label for="equation">y =</label><input id="equation" value="x" maxlength="120" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="ロケットの軌道を表す数式"><div class="direction" role="group" aria-label="発射方向"><button id="left" type="button" aria-pressed="false">←</button><button id="right" type="button" aria-pressed="true">→</button></div><button id="fire" type="submit">FIRE</button></form>
<div id="symbols" aria-label="数式入力補助"><button data-symbol="x" type="button">x</button><button data-symbol="^2" type="button">²</button><button data-symbol="(" type="button">(</button><button data-symbol=")" type="button">)</button><button data-symbol="/" type="button">÷</button><button data-symbol="*" type="button">×</button><button data-symbol="sin(" type="button">sin</button><button data-symbol="cos(" type="button">cos</button></div>
<p id="status" role="status"></p><button id="next" hidden>次のステージ</button>
<details><summary>遊び方</summary><p>原点を通る数式を入力し、左右の発射方向を選択。軌道上の拠点と飛来物を破壊しよう。発射するたび飛来物が原点に近づく。全滅させればクリア。</p><p>例：x、-2x、x^2/4、sin(x)。三角関数はラジアン。</p></details></main></body></html>
