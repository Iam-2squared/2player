<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111f34"><title>GRAPH ROCKET | KUSO Game</title><link rel="stylesheet" href="/rocket.css"><script src="/rocket-rules.js" defer></script><script src="/rocket.js" defer></script></head>
<body><main><header><a href="/" aria-label="ゲーム一覧に戻る">‹</a><h1>GRAPH ROCKET</h1><button id="reset" aria-label="ステージ選択">☷</button></header>
<section id="rocket-menu"><h2>STAGE SELECT</h2><div id="stage-list"></div><p id="progress-status" role="status"></p></section><section id="rocket-play" hidden><div class="stats"><strong id="stage">01</strong><span id="ammo" aria-label="残り発射回数">1</span></div>
<svg id="field" viewBox="0 0 440 440" role="img" aria-label="第一象限の座標平面と宇宙基地">
<defs>
 <linearGradient id="space" x2=".7" y2="1"><stop stop-color="#050b19"/><stop offset="1" stop-color="#142a43"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#376394" stop-opacity=".38"/><stop offset="1" stop-color="#18304d" stop-opacity="0"/></radialGradient>
 <linearGradient id="planet" x2="1" y2="1"><stop stop-color="#577d9b"/><stop offset=".58" stop-color="#243e60"/><stop offset="1" stop-color="#0b1729"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
 <clipPath id="graph-clip"><rect x="40" y="40" width="360" height="360"/></clipPath>
</defs>
<rect width="440" height="440" fill="url(#space)"/>
<ellipse cx="310" cy="105" rx="230" ry="150" fill="url(#nebula)" transform="rotate(-28 310 105)"/>
<g id="stars" aria-hidden="true"></g>
<g opacity=".65"><circle cx="350" cy="91" r="55" fill="url(#planet)"/><ellipse cx="350" cy="91" rx="80" ry="16" transform="rotate(-25 350 91)" fill="none" stroke="#7795ac" stroke-width="2" opacity=".48"/><path d="M310 55Q351 47 389 76" stroke="#a1b6c9" stroke-width="1" fill="none" opacity=".5"/></g>
<g id="axes" stroke="#b7d3e4" stroke-width="1.4" fill="none"><path d="M40 400H409l-5 -3m5 3l-5 3M40 400V31l-3 5m3 -5l3 5"/></g>
<g id="base-bg" transform="translate(40 400)" aria-hidden="true">
 <ellipse rx="28" ry="21" fill="#1f546e" opacity=".7" filter="url(#glow)"/>
 <path d="M-22 7L-13 15H13L22 7V-7L13 -15H-13L-22 -7Z" fill="#263e57" stroke="#6b8da8" stroke-width="1.5"/>
 <path d="M-19 -4H19M-19 4H19" stroke="#97b0c8" opacity=".7"/>
 <circle r="12" fill="#0d2239" stroke="#79e5e2" stroke-width="1.5"/><circle r="7" fill="none" stroke="#79e5e2" stroke-dasharray="2 3"/>
 <path d="M-23 -9H-32V9H-23M23 -9H32V9H23" fill="#274760" stroke="#6a9bbc"/>
 <circle cx="-27" cy="0" r="2" fill="#82f6d9"/><circle cx="27" cy="0" r="2" fill="#82f6d9"/>
</g>
<g id="labels"></g><g id="targets"></g>
<g clip-path="url(#graph-clip)">
 <path id="preview" fill="none" stroke="#71c6d4" stroke-dasharray="4 5" stroke-width="1.6"/>
 <path id="trail-glow" fill="none" stroke="#6fffea" stroke-width="6" filter="url(#glow)"/>
 <path id="trail" fill="none" stroke="#c4fff4" stroke-width="2.7" stroke-linecap="round"/>
</g>
<g id="ship" transform="translate(40 400) rotate(45)"><path d="M0 -15Q9 -6 5 7H-5Q-9 -6 0 -15Z" fill="#f4f8ff" stroke="#a4c2d3" stroke-width=".8"/><path d="M-5 2L-9 9L-4 7M5 2L9 9L4 7" fill="#7baac4"/><circle cy="-4" r="3" fill="#62c4db"/><path d="M-3 9L0 18L3 9" fill="#ffbd71"/></g>
</svg>
<form id="fire-form"><label for="equation">y =</label><input id="equation" value="x" maxlength="120" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="ロケットの軌道を表す数式"><button id="fire" type="submit">FIRE</button></form>
<div id="symbols" aria-label="数式入力補助"><button data-symbol="x" type="button">x</button><button data-symbol="^2" type="button">²</button><button data-symbol="^3" type="button">³</button><button data-symbol="^4" type="button">⁴</button><button data-symbol="(" type="button">(</button><button data-symbol=")" type="button">)</button><button data-symbol="/" type="button">÷</button><button data-symbol="*" type="button">×</button><button data-symbol="sin(" type="button">sin</button><button data-symbol="cos(" type="button">cos</button></div>
<p id="status" role="status"></p><button id="next" hidden>次のステージ</button>
<details><summary>遊び方</summary><p>原点を通る数式を入力し、1回の発射ですべての拠点・飛来物に命中させよう。失敗したら同じステージに再挑戦。</p><p>例：x²/4、x³/8、x⁴/16。三角関数はラジアン。</p></details></section></main></body></html>
