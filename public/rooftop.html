<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ROOFTOP DUEL | KUSO Game</title><link rel="stylesheet" href="/rooftop.css"><script src="/zoom-lock.js" defer></script><script src="/rooftop.js" defer></script></head><body>
<main id="lobby"><header><a href="/" id="home" aria-label="ゲーム一覧へ">‹</a><h1>ROOFTOP DUEL</h1></header><p class="muted">対戦相手を指定</p><div id="invites"></div><div id="online"></div><p id="lobby-status" role="status">接続中…</p></main>
<section id="game" hidden><div id="arena">

<path d="M0 399H960V540H0Z" fill="url(#roof)"/><path d="M0 399H960" stroke="#d9e4e8" stroke-width="4"/>

<path d="M0 416H960M0 494H960M160 399L98 540M800 399L862 540" fill="none" stroke="#70858f" stroke-width="2" opacity=".5"/>

<rect x="-52" y="4" width="21" height="39" fill="#447f87"/><rect x="-52" y="43" width="21" height="23" fill="#d8a477"/><rect x="37" y="4" width="21" height="39" fill="#447f87"/><rect x="37" y="43" width="21" height="23" fill="#d8a477"/>
<rect x="-31" y="66" width="27" height="48" fill="#3d4b65"/><rect x="0" y="66" width="27" height="48" fill="#3d4b65"/><path d="M-31 106H-4V119H-31Z M0 106H27V119H0Z" fill="#273743"/></g></g></g>
<g id="near-cover"><path d="M300 540V132L335 99H655L690 132V540Z" fill="#213749"/><path d="M300 132H690V540H300Z" fill="url(#wall)" stroke="#97a9b6" stroke-width="5"/><path d="M300 132L335 99H655L690 132Z" fill="#7a8c99"/><path d="M325 178H665M325 270H665M325 362H665M325 454H665" stroke="#657d8d" stroke-width="3" opacity=".55"/></g>

<div id="hud"><a id="exit" href="/" aria-label="退出">‹</a><span id="round">ROUND 1</span><strong id="score">0 : 0</strong><span id="opponent-name"></span></div>
<div id="peek-controls" hidden><button data-peek="up" class="peek up">↑<small>上</small></button><button data-peek="left" class="peek left">←<small>左</small></button><button data-peek="right" class="peek right">→<small>右</small></button></div>
<button id="cover" hidden>‹ 戻る</button><button id="fire" hidden aria-label="発射"><svg viewBox="0 0 100 100" aria-hidden="true" id="ammo-ring"></svg><span id="fire-label">FIRE</span><small id="ammo-count">10 / 10</small></button>
<div id="overlay" class="overlay"><h2 id="overlay-title">準備</h2><p id="overlay-sub"></p><button id="ready">準備 OK</button><button id="return" hidden>対戦一覧へ</button></div><p id="game-status" role="status"></p>
</div><div id="rotate"><span>↻</span><strong>横向きにしてください</strong><p>横向きで準備 OK</p><a href="/" id="portrait-exit">退出</a></div></section></body></html>
