<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#172329"><title>TEN LINK | 2player</title><link rel="stylesheet" href="/solo.css"><script src="/solo-rules.js" defer></script><script src="/solo.js" defer></script></head>
<body><main class="solo"><header><a href="/" aria-label="2player ロビーに戻る">‹ ロビー</a><span>2player<span class="dot">.</span> / SOLO</span></header>
<section id="intro" class="intro"><p class="eyebrow">NUMBER PUZZLE</p><h1>TEN<span> LINK</span></h1><p class="intro-copy">数字をつないで、10をつくろう。</p><svg id="demo" viewBox="0 0 500 500" aria-label="数字をつなぐゲームの例"></svg><p class="rules">縦・横・斜めにつなぎ、合計10でゴールドに。<br>ゴールドの10同士をつなげると高得点。</p><button class="primary" id="start">START</button><p class="best">この端末の最高得点 <strong id="best">0</strong></p><p class="quiet">60秒 · ソロ専用 · 轟の増減なし</p><section class="ranking-panel"><h2>ランキング</h2><p class="quiet" id="ranking-status" role="status">読み込み中…</p><ol id="ranking-list"></ol><button class="secondary" id="ranking-refresh">更新</button></section></section>
<section id="play" hidden><div class="score-row"><div><span>SCORE</span><strong id="score">0</strong></div><button id="quit" class="secondary">終了</button></div><div id="sum" class="sum" aria-live="polite">0</div><svg id="board" viewBox="0 0 500 500" role="group" aria-label="数字盤面。指でドラッグ、または数字を順に選択して確定"></svg><div class="timer"><progress id="timer" max="60" value="60" aria-label="残り時間"></progress><strong id="seconds">60</strong></div><div class="actions"><button id="clear" class="secondary">選択解除</button><button id="commit" class="secondary">確定</button></div><p id="feedback" class="quiet" role="status">数字をつないで10を作る</p></section>
<section id="result" class="result" hidden><p class="eyebrow">TIME UP</p><h2>FINISH</h2><p class="quiet">今回のスコア</p><strong id="final-score">0</strong><p id="record" class="best"></p><p id="rank-result" class="quiet" role="status"></p><button id="rank-view" class="secondary">ランキングを見る</button><button id="again" class="primary">もう一度</button><a class="secondary link" href="/">ロビーへ戻る</a></section>
</main></body></html>
