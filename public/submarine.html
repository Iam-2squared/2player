<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>SUBMARINE | KUSO Game</title><link rel="stylesheet" href="/submarine.css"><script src="/zoom-lock.js" defer></script><script src="/submarine.js" defer></script></head><body><main><header><a id="home" href="/" aria-label="ゲーム一覧へ">‹</a><h1>SUBMARINE</h1></header><section id="lobby"><p class="muted">対戦相手を指定</p><div id="invites"></div><div id="online"></div><p id="lobby-status"></p></section><section id="game" hidden><div class="hud"><span id="opponent"></span><strong id="clock"></strong></div><h2 id="turn"></h2><section id="attack" hidden><div class="board-label"><strong>相手の海域</strong><span id="hits"></span></div><div id="enemy-board" class="board"></div><button id="fire" disabled>砲撃</button></section><section id="setup" hidden><p class="muted">艦の長さと向きを選択し、マスをタップして配置。</p><div id="lengths"></div><div id="directions"><button data-dir="h" aria-pressed="true">横向き ↔</button><button data-dir="v" aria-pressed="false">縦向き ↕</button><button id="random">ランダム配置</button></div></section><div class="board-label"><strong>自分の海域</strong><span id="remaining"></span></div><div id="own-board" class="board"></div><button id="ready" hidden disabled>準備完了</button><div id="result" hidden><strong id="outcome"></strong><button id="return">対戦一覧へ</button></div><p id="status" role="status"></p></section></main></body></html>
