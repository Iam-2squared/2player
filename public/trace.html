<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>TRACE | KUSO Game</title><link rel="stylesheet" href="/trace.css"><script src="/zoom-lock.js" defer></script><script src="/trace-rules.js" defer></script><script src="/trace.js" defer></script></head><body><main><header><a href="/" aria-label="ゲーム一覧へ">‹</a><h1>TRACE</h1></header><section id="menu"><h2>コース選択</h2><div id="courses"></div><button id="start">START</button><section class="ranking"><h2>ランキング</h2><p id="ranking-status"></p><ol id="ranking-list"></ol></section></section><div id="count" hidden>3</div><section id="play" hidden><div class="hud"><span id="question-number"></span><strong id="timer">30.0 s</strong></div><h2 id="question"></h2><div id="graph"><svg id="paper" viewBox="0 0 420 420" aria-label="手書き作図エリア"><rect x="10" y="10" width="400" height="400" fill="#192b37" stroke="#455967"/><path d="M10 210H410M210 10V410" stroke="#a8bac9" stroke-width="1.5"/><path d="M10 204V216M410 204V216M204 10H216M204 410H216" stroke="#a8bac9" stroke-width="1.5"/><g fill="#a8bac9" font-size="11"><text x="15" y="226">−10</text><text x="405" y="226" text-anchor="end">10</text><text x="218" y="23">10</text><text x="218" y="405">−10</text><text x="398" y="201">x</text><text x="199" y="23">y</text></g><g id="solution"></g><g id="ink"></g></svg></div><div id="actions"><button id="undo">一つ戻す</button><button id="clear">消去</button><button id="submit">提出</button></div><div id="feedback" hidden><strong id="accuracy"></strong><span>一致率</span><button id="next">次の問題</button></div><p id="status" role="status"></p></section><section id="result" hidden><span>5問の平均一致率</span><strong id="average"></strong><div id="breakdown"></div><p id="save-status"></p><button id="again">コース選択へ</button></section></main></body></html>
