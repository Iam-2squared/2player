<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Graphwar | KUSO Game</title><link rel="stylesheet" href="/war.css"><script src="/zoom-lock.js" defer></script><script src="/war-math.js" defer></script><script src="/war.js" defer></script></head><body><main><header><a id="leave" href="/" aria-label="ゲーム一覧へ">‹</a><h1>Graphwar</h1><span id="population">0</span></header><div id="turnbar"><strong id="turn">接続中…</strong><span id="clock"></span></div><div id="field-scroll" tabindex="0" aria-label="横スクロール可能なフィールド"><svg id="field" viewBox="0 0 2000 1000" role="img" aria-label="対戦フィールド"><rect width="2000" height="1000" fill="#101e31"/><g stroke="#56748c" stroke-width="3"><path d="M0 500H2000M1000 0V1000"/></g><g fill="#9db0c2" font-size="27"><text x="1975" y="485" text-anchor="end">x</text><text x="1015" y="36">y</text><text x="1975" y="970" text-anchor="end">2000</text><text x="24" y="45">1000</text></g><g id="obstacles"></g><g id="trails"></g><g id="players"></g></svg></div><div class="field-tools"><button id="center" type="button">自分の位置</button><span>2000 × 1000</span></div><section id="controls"><form id="fire-form"><label for="equation">数式</label><input id="equation" value="y=x" maxlength="120" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="buttons"><button id="left" type="button" aria-pressed="false">←</button><button id="right" type="button" aria-pressed="true">→</button><button id="pass" type="button" disabled>PASS</button><button id="fire" type="submit" disabled>FIRE</button></div></form><div id="symbols"><button data-symbol="x">x</button><button data-symbol="y">y</button><button data-symbol="^2">²</button><button data-symbol="^3">³</button><button data-symbol="^4">⁴</button><button data-symbol="(">(</button><button data-symbol=")">)</button><button data-symbol="=">=</button><button data-symbol="/">÷</button><button data-symbol="sin(">sin</button></div><p id="status" role="status"></p><details><summary>数式の例</summary><p>自分を原点とする軌道：y=x/2、y=x²/500、x²+y²=300x。通常の関数は左右を選択、陰関数は原点につながる曲線を描きます。</p></details></section></main></body></html>
